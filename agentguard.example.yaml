version: 1
default: ask

server:
  host: 127.0.0.1
  port: 7788

audit:
  database: .agentguard/agentguard.db

rules:
  - id: protect-secrets
    kind: file
    match: [".env*", "**/.env*", "**/*.pem", "**/.ssh/**"]
    decision: deny
    reason: sensitive file is protected

  - id: safe-tests
    kind: shell
    match: ["go test*", "dotnet test*", "npm test*"]
    decision: allow
    reason: test command is allowed

  - id: git-push
    kind: shell
    match: ["git push*"]
    decision: ask
    reason: remote repository mutation requires approval

  - id: production-write
    kind: database
    match: ["*UPDATE *", "*DELETE *", "*DROP *", "*TRUNCATE *"]
    decision: deny
    reason: database mutation is denied by this policy
