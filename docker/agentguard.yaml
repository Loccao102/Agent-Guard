version: 1
default: ask

server:
  host: 0.0.0.0
  port: 7788

audit:
  database: /app/.agentguard/agentguard.db

rules:
  - id: protect-secrets
    kind: file
    match: [".env*", "**/.env*", "**/*.pem", "**/.ssh/**"]
    decision: deny
    reason: sensitive file is protected

  - id: destructive-shell
    kind: shell
    match: ["rm -rf*", "del /f*", "format *", "shutdown*", "reboot*"]
    decision: deny
    reason: destructive system command is blocked

  - id: safe-tests
    kind: shell
    match: ["go test*", "dotnet test*", "npm test*", "pnpm test*"]
    decision: allow
    reason: test command is allowed

  - id: git-push
    kind: shell
    match: ["git push*"]
    decision: ask
    reason: remote repository mutation requires approval
