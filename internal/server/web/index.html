<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AgentGuard</title>
  <style>
    :root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--line:#252b38;--text:#eef2f8;--muted:#8f9bad;--good:#63d392;--warn:#f7c66b;--bad:#ff7272}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1180px;margin:auto;padding:32px 20px 60px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:22px;font-weight:750}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.card b{font-size:26px;display:block;margin-top:4px}.muted{color:var(--muted)}section{margin-top:18px}.tester{display:grid;grid-template-columns:160px 1fr 120px;gap:10px}input,select,button{background:#0c1016;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}button{cursor:pointer;font-weight:650}.result{margin-top:10px;min-height:42px}.allow{color:var(--good)}.ask{color:var(--warn)}.deny{color:var(--bad)}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}th{color:var(--muted);font-weight:600}.value{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.tester{grid-template-columns:1fr}table{font-size:12px}.hide-sm{display:none}}
  </style>
</head>
<body>
<main>
  <header><div><div class="brand">🛡️ AgentGuard</div><div class="muted">Local-first firewall for AI agents</div></div><div class="pill" id="health">checking…</div></header>
  <div class="grid">
    <div class="card"><span class="muted">Total</span><b id="total">0</b></div>
    <div class="card"><span class="muted">Allowed</span><b id="allowed" class="allow">0</b></div>
    <div class="card"><span class="muted">Ask</span><b id="asked" class="ask">0</b></div>
    <div class="card"><span class="muted">Denied</span><b id="denied" class="deny">0</b></div>
    <div class="card"><span class="muted">High risk</span><b id="highRisk">0</b></div>
  </div>
  <section class="card">
    <h3>Policy tester</h3>
    <div class="tester">
      <select id="kind"><option>shell</option><option>file</option><option>git</option><option>database</option><option>network</option><option>mcp</option></select>
      <input id="value" value="git push origin main" placeholder="Action value" />
      <button onclick="evaluateAction()">Evaluate</button>
    </div>
    <div id="result" class="result muted">Try an action against your local policy.</div>
  </section>
  <section class="card">
    <h3>Recent events</h3>
    <table><thead><tr><th>Time</th><th>Agent</th><th>Kind</th><th>Decision</th><th>Risk</th><th class="hide-sm">Action</th></tr></thead><tbody id="events"></tbody></table>
  </section>
</main>
<script>
async function json(url, options){const r=await fetch(url,options);if(!r.ok)throw new Error(await r.text());return r.json()}
async function refresh(){try{const h=await json('/api/health');document.getElementById('health').textContent=h.status==='ok'?'● local / healthy':'unhealthy';const s=await json('/api/stats');for(const [id,key] of [['total','total'],['allowed','allowed'],['asked','asked'],['denied','denied'],['highRisk','high_risk']])document.getElementById(id).textContent=s[key]||0;const events=await json('/api/events?limit=50');document.getElementById('events').innerHTML=(events||[]).map(e=>`<tr><td>${new Date(e.timestamp).toLocaleTimeString()}</td><td>${esc(e.agent)}</td><td>${esc(e.kind)}</td><td class="${e.decision}">${esc(e.decision.toUpperCase())}</td><td>${esc(e.risk)}</td><td class="value hide-sm" title="${esc(e.value)}">${esc(e.value)}</td></tr>`).join('')}catch(e){document.getElementById('health').textContent='● unavailable'}}
async function evaluateAction(){const result=document.getElementById('result');try{const data=await json('/api/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agent:'dashboard',kind:document.getElementById('kind').value,value:document.getElementById('value').value})});result.className='result '+data.decision;result.textContent=`${data.decision.toUpperCase()} · ${data.risk.toUpperCase()} — ${data.reason}`;refresh()}catch(e){result.textContent='Request failed'}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
refresh();setInterval(refresh,4000)
</script>
</body></html>
